<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Operations — Add entry</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="page">
    <header class="topbar">
      <span class="user">{{ user_name }}</span>
      <span>
        <a class="nav-link" href="{{ url_for('main.history_page') }}">History</a>
        <form method="post" action="{{ url_for('main.logout') }}" style="display:inline">
          <button type="submit" class="link-button">Log out</button>
        </form>
      </span>
    </header>

    <div class="card">
      <h1>Add entry</h1>

      {% if message %}
        <p class="success">{{ message }}</p>
      {% endif %}

      {% if errors %}
        <ul class="error-list">
          {% for err in errors %}
            <li>{{ err }}</li>
          {% endfor %}
        </ul>
      {% endif %}

  <form method="post" action="{{ url_for('main.insert_operation') }}">
        <label for="amount">Amount</label>
        <input
          type="number"
          id="amount"
          name="amount"
          inputmode="numeric"
          min="1"
          step="1"
          required
          value="{{ form.amount if form else '' }}"
        >
        <div class="amount-quick">
          <button type="button" class="chip-btn" data-add="1000">+1k</button>
          <button type="button" class="chip-btn" data-add="10000">+10k</button>
          <button type="button" class="chip-btn" data-add="100000">+100k</button>
          <button type="button" class="chip-btn" data-add="1000000">+1M</button>
        </div>
        <label for="direction">Direction</label>
        <select id="direction" name="direction" required>
          <option value="" disabled {% if not form %}selected{% endif %}>Select…</option>
          {% for d in directions %}
            <option value="{{ d.value }}" {% if form and form.direction == d.value %}selected{% endif %}>
              {{ d.value.replace('_', ' ')|title }}
            </option>
          {% endfor %}
        </select>

        <label for="category">Category</label>
        <select id="category" name="category" required>
          <option value="" disabled {% if not form %}selected{% endif %}>Select…</option>
          {% for c in categories %}
            <option value="{{ c.value }}" {% if form and form.category == c.value %}selected{% endif %}>
              {{ c.value.replace('_', ' ')|title }}
            </option>
          {% endfor %}
        </select>

        <div id="expense-type-field">
          <label for="expense_type">Expense type</label>
          <select id="expense_type" name="expense_type">
            <option value="" disabled {% if not form %}selected{% endif %}>Select…</option>
            {% for et in expense_types %}
              <option value="{{ et.value }}" {% if form and form.expense_type == et.value %}selected{% endif %}>
                {{ et.value.replace('_', ' ')|title }}
              </option>
            {% endfor %}
          </select>
        </div>

        <div id="related-user-field">
          <label for="related_user_uuid">Flag to user (optional)</label>
          <select id="related_user_uuid" name="related_user_uuid">
            <option value="" {% if not form or not form.related_user_uuid %}selected{% endif %}>None</option>
            {% for u in users %}
              <option value="{{ u.uuid }}" {% if form and form.related_user_uuid == u.uuid %}selected{% endif %}>
                {{ u.name or u.uuid[:8] }}
              </option>
            {% endfor %}
          </select>
          <p class="hint">If category is User and you don't pick someone here, add a comment instead.</p>
        </div>

        <label for="comment">Comment (optional)</label>
        <textarea id="comment" name="comment" rows="2">{{ form.comment if form else '' }}</textarea>

        <button type="submit">Save</button>
      </form>
    </div>
  </main>

  <script>
    (function () {
      const directionSelect = document.getElementById('direction');
      const categorySelect = document.getElementById('category');
      const expenseTypeField = document.getElementById('expense-type-field');
      const expenseTypeSelect = document.getElementById('expense_type');
      const relatedUserField = document.getElementById('related-user-field');
      const relatedUserSelect = document.getElementById('related_user_uuid');
      const commentField = document.getElementById('comment');
      const form = document.querySelector('form[action$="/insert"]');

      function syncExpenseType() {
        const isExpense = directionSelect.value === 'expense';
        expenseTypeField.classList.toggle('hidden', !isExpense);
        expenseTypeSelect.required = isExpense;
        if (!isExpense) {
          expenseTypeSelect.value = '';
        }
      }

      function syncRelatedUser() {
        const isUserCategory = categorySelect.value === 'user';
        relatedUserField.classList.toggle('hidden', !isUserCategory);
        if (!isUserCategory) {
          relatedUserSelect.value = '';
        }
      }

      directionSelect.addEventListener('change', syncExpenseType);
      const amountInput = document.getElementById('amount');
      const quickButtons = document.querySelectorAll('.chip-btn[data-add]');
      categorySelect.addEventListener('change', syncRelatedUser);
      syncExpenseType();
      syncRelatedUser();

      quickButtons.forEach(function (btn) {
        btn.addEventListener('click', function () {
          const current = parseInt(amountInput.value, 10) || 0;
          amountInput.value = current + parseInt(btn.dataset.add, 10);
          amountInput.focus();
        });
      });
      directionSelect.addEventListener('change', syncExpenseType);

      form.addEventListener('submit', function (event) {
        const isUserCategory = categorySelect.value === 'user';
        const noRelatedUser = !relatedUserSelect.value;
        const noComment = !commentField.value.trim();
        if (isUserCategory && noRelatedUser && noComment) {
          event.preventDefault();
          alert('Category is User but no one is selected — add a comment, or pick a user.');
        }
      });
    })();
  </script>
</body>
</html>
